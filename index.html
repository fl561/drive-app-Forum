<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Super Fancy Feed</title>
    <!-- Fixed favicon (no more 404) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✨</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family:"Inter",sans-serif;
            background:#0b0d15;
            color:#eef2ff;
            display:flex;
            justify-content:center;
            padding:2rem 1rem;
            min-height:100vh;
            background-image:radial-gradient(circle at 10% 20%,rgba(120,119,198,0.15)0%,transparent 50%),
                             radial-gradient(circle at 90% 80%,rgba(255,119,198,0.15)0%,transparent 50%);
        }
        .app-container { max-width:680px; width:100%; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:2rem; padding:0 0.5rem; }
        .header h1 { font-size:1.8rem; font-weight:700; background:linear-gradient(135deg,#a78bfa,#f472b6); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; letter-spacing:-0.5px; }
        .header i { font-size:1.5rem; color:#a78bfa; cursor:default; filter:drop-shadow(0 0 8px rgba(167,139,250,0.3)); }
        .create-post { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.08); border-radius:24px; padding:1.5rem; margin-bottom:2rem; box-shadow:0 20px 40px -12px rgba(0,0,0,0.6); }
        .create-post textarea { width:100%; background:rgba(0,0,0,0.3); border:1px solid rgba(255,255,255,0.06); border-radius:16px; padding:1rem; color:#eef2ff; font-size:0.95rem; font-family:"Inter",sans-serif; resize:vertical; min-height:80px; outline:none; transition:border 0.2s; }
        .create-post textarea:focus { border-color:#a78bfa; box-shadow:0 0 0 4px rgba(167,139,250,0.15); }
        .create-post textarea::placeholder { color:#64748b; }
        .post-actions { display:flex; justify-content:flex-end; margin-top:1rem; gap:1rem; align-items:center; }
        .post-actions button { background:linear-gradient(135deg,#7c3aed,#db2777); border:none; padding:0.6rem 1.8rem; border-radius:40px; color:white; font-weight:600; font-size:0.9rem; cursor:pointer; transition:all 0.2s ease; box-shadow:0 4px 15px rgba(124,58,237,0.3); display:flex; align-items:center; gap:8px; }
        .post-actions button:hover { transform:scale(1.03); box-shadow:0 8px 25px rgba(124,58,237,0.5); }
        .post-actions button:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
        .feed-list { display:flex; flex-direction:column; gap:1.25rem; }
        .post-card { background:rgba(255,255,255,0.04); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.06); border-radius:24px; padding:1.5rem; transition:all 0.25s cubic-bezier(0.2,0,0,1); box-shadow:0 10px 30px -10px rgba(0,0,0,0.4); animation:fadeSlideUp 0.4s ease forwards; opacity:0; }
        .post-card:hover { border-color:rgba(167,139,250,0.25); transform:translateY(-2px); box-shadow:0 20px 40px -12px rgba(0,0,0,0.7); }
        @keyframes fadeSlideUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
        .post-header { display:flex; align-items:center; gap:0.75rem; margin-bottom:0.75rem; }
        .avatar { width:40px; height:40px; border-radius:40px; background:linear-gradient(135deg,#4f46e5,#a78bfa); display:flex; align-items:center; justify-content:center; font-weight:600; font-size:1rem; color:white; flex-shrink:0; box-shadow:0 4px 10px rgba(79,70,229,0.3); }
        .post-user { font-weight:600; font-size:0.95rem; }
        .post-user span { color:#94a3b8; font-weight:400; margin-left:6px; font-size:0.8rem; }
        .post-time { margin-left:auto; font-size:0.75rem; color:#64748b; background:rgba(0,0,0,0.2); padding:4px 10px; border-radius:40px; }
        .post-content { font-size:1rem; line-height:1.6; color:#f1f5f9; margin-bottom:1rem; word-wrap:break-word; }
        .post-image { width:100%; max-height:320px; object-fit:cover; border-radius:16px; margin:0.5rem 0 1rem 0; border:1px solid rgba(255,255,255,0.05); }
        .post-footer { display:flex; align-items:center; gap:1.5rem; padding-top:0.75rem; border-top:1px solid rgba(255,255,255,0.05); }
        .like-btn { display:flex; align-items:center; gap:6px; background:none; border:none; color:#94a3b8; font-size:0.9rem; cursor:pointer; padding:4px 8px; border-radius:40px; transition:all 0.15s ease; font-family:"Inter",sans-serif; }
        .like-btn i { font-size:1.1rem; transition:transform 0.2s ease; }
        .like-btn.liked { color:#f472b6; }
        .like-btn.liked i { font-weight:900; transform:scale(1.1); animation:pop 0.3s ease; }
        @keyframes pop { 0% { transform:scale(1); } 50% { transform:scale(1.5); } 100% { transform:scale(1.1); } }
        .like-btn:hover { color:#eef2ff; }
        .like-btn.liked:hover { color:#ec4899; }
        .post-footer .fa-comment { color:#64748b; cursor:default; }
        .skeleton { background:rgba(255,255,255,0.04); border-radius:24px; padding:1.5rem; border:1px solid rgba(255,255,255,0.04); animation:pulse 1.5s ease-in-out infinite; }
        @keyframes pulse { 0%,100% { opacity:0.4; } 50% { opacity:0.7; } }
        .skeleton .line { height:14px; background:rgba(255,255,255,0.06); border-radius:10px; margin-bottom:10px; }
        .skeleton .line.short { width:40%; }
        .skeleton .line.long { width:100%; }
        .empty-state { text-align:center; padding:3rem 1rem; color:#64748b; }
        .empty-state i { font-size:3rem; margin-bottom:1rem; opacity:0.3; }
        ::-webkit-scrollbar { width:6px; }
        ::-webkit-scrollbar-track { background:transparent; }
        ::-webkit-scrollbar-thumb { background:#334155; border-radius:10px; }
        ::-webkit-scrollbar-thumb:hover { background:#475569; }
    </style>
</head>
<body>
<div class="app-container">
    <div class="header">
        <h1><i class="fas fa-bolt" style="margin-right:8px;-webkit-text-fill-color:#a78bfa;"></i> Pulse</h1>
        <i class="fas fa-circle-nodes"></i>
    </div>
    <div class="create-post">
        <textarea id="postInput" placeholder="What's on your mind, superstar? ✨" rows="2"></textarea>
        <div class="post-actions">
            <span style="font-size:0.8rem;color:#475569;"><i class="fas fa-lock" style="margin-right:4px;"></i>anon</span>
            <button id="publishBtn"><i class="fas fa-paper-plane"></i> Publish</button>
        </div>
    </div>
    <div id="feedContainer" class="feed-list"></div>
</div>
<script>
(function() {
    // ==============================================================
    //  🔥 YOUR SUPABASE URL AND PUBLISHABLE KEY ARE BOTH HARDCODED
    // ==============================================================
    const SUPABASE_URL = "https://bkvvvlaibtbrrkbuxnke.supabase.co";
    const SUPABASE_KEY = "sb_publishable_ypObXvuLKlTXutfClJfwJQ_rqaG2mRi";

    // ⚠️ DO NOT use the secret key (sb_secret_...) in this client-side code!
    // It gives full admin access – keep it safe for backend use only.

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const feedContainer = document.getElementById('feedContainer');
    const postInput = document.getElementById('postInput');
    const publishBtn = document.getElementById('publishBtn');
    let posts = [];
    let isSubmitting = false;

    function getTimeAgo(dateString) {
        const now = new Date();
        const past = new Date(dateString);
        const diffMs = now - past;
        const diffMins = Math.floor(diffMs / 60000);
        if (diffMins < 1) return 'just now';
        if (diffMins < 60) return diffMins + 'm ago';
        const diffHours = Math.floor(diffMins / 60);
        if (diffHours < 24) return diffHours + 'h ago';
        const diffDays = Math.floor(diffHours / 24);
        if (diffDays < 7) return diffDays + 'd ago';
        return past.toLocaleDateString('en-US', { month:'short', day:'numeric' });
    }

    function getInitials(email) {
        if (!email) return '?';
        const parts = email.split('@')[0].split(/[._-]/);
        if (parts.length === 1) return parts[0].substring(0,2).toUpperCase();
        return (parts[0][0] + parts[1][0]).toUpperCase();
    }

    function getColorFromEmail(email) {
        let hash = 0;
        for (let i=0; i<email.length; i++) hash = email.charCodeAt(i) + ((hash << 5) - hash);
        return 'hsl(' + (Math.abs(hash % 360)) + ',70%,55%)';
    }

    function escapeHTML(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderPosts(postData) {
        if (!postData || postData.length === 0) {
            feedContainer.innerHTML = '<div class="empty-state"><i class="fas fa-feather-pointed"></i><p>No posts yet. Be the first to shine! ✨</p></div>';
            return;
        }
        let html = '';
        postData.forEach(post => {
            const initials = getInitials(post.user_email || 'anonymous@user.com');
            const color = getColorFromEmail(post.user_email || 'anon');
            const timeAgo = getTimeAgo(post.created_at);
            const displayName = post.user_email ? post.user_email.split('@')[0] : 'Anonymous';
            const likeCount = post.likes_count || 0;
            html += `
                <div class="post-card" data-id="${post.id}">
                    <div class="post-header">
                        <div class="avatar" style="background:${color};">${initials}</div>
                        <div class="post-user">${displayName} <span>· ${post.user_email || 'anon'}</span></div>
                        <div class="post-time">${timeAgo}</div>
                    </div>
                    <div class="post-content">${escapeHTML(post.content)}</div>
                    ${post.image_url ? `<img src="${post.image_url}" alt="Post image" class="post-image" loading="lazy" />` : ''}
                    <div class="post-footer">
                        <button class="like-btn" data-id="${post.id}">
                            <i class="fa-regular fa-heart"></i> <span class="like-count">${likeCount}</span>
                        </button>
                        <span style="color:#475569;font-size:0.9rem;"><i class="fa-regular fa-comment"></i> 0</span>
                    </div>
                </div>
            `;
        });
        feedContainer.innerHTML = html;
        document.querySelectorAll('.like-btn').forEach(btn => btn.addEventListener('click', handleLike));
    }

    function showSkeletons(count) {
        count = count || 3;
        let skelHtml = '';
        for (let i=0; i<count; i++) {
            skelHtml += `<div class="skeleton"><div class="line short"></div><div class="line long"></div><div class="line long" style="width:80%;"></div><div class="line short" style="width:30%;margin-bottom:0;"></div></div>`;
        }
        feedContainer.innerHTML = skelHtml;
    }

    async function fetchFeed() {
        showSkeletons(3);
        try {
            const { data, error } = await supabase.from('posts').select('*').order('created_at', { ascending: false });
            if (error) throw error;
            posts = data || [];
            renderPosts(posts);
        } catch (err) {
            console.error('Fetch error:', err);
            feedContainer.innerHTML = '<div class="empty-state" style="color:#f87171;"><i class="fas fa-circle-exclamation"></i><p>Could not load feed. Check console or RLS policies.</p></div>';
        }
    }

    async function createPost(content) {
        if (isSubmitting) return;
        isSubmitting = true;
        publishBtn.disabled = true;
        publishBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Sending...';
        try {
            const newPost = { content: content.trim(), user_email: 'user_' + Math.floor(Math.random()*10000) + '@pulse.local', likes_count: 0 };
            const { data, error } = await supabase.from('posts').insert([newPost]).select();
            if (error) throw error;
            if (data && data.length > 0) { posts.unshift(data[0]); renderPosts(posts); }
            postInput.value = '';
        } catch (err) {
            console.error('Publish error:', err);
            alert('Failed to publish: ' + err.message);
        } finally {
            isSubmitting = false;
            publishBtn.disabled = false;
            publishBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Publish';
        }
    }

    async function handleLike(e) {
        const btn = e.currentTarget;
        const postId = btn.dataset.id;
        const likeSpan = btn.querySelector('.like-count');
        const icon = btn.querySelector('i');
        const currentLikes = parseInt(likeSpan.textContent, 10) || 0;
        const isLiked = btn.classList.toggle('liked');
        const newLikeCount = isLiked ? currentLikes + 1 : currentLikes - 1;
        likeSpan.textContent = newLikeCount;
        icon.className = isLiked ? 'fa-solid fa-heart' : 'fa-regular fa-heart';
        const postIndex = posts.findIndex(p => String(p.id) === String(postId));
        if (postIndex !== -1) posts[postIndex].likes_count = newLikeCount;
        try {
            const { error } = await supabase.from('posts').update({ likes_count: newLikeCount }).eq('id', postId);
            if (error) console.error('Like update error:', error);
        } catch (err) { console.error('Like fetch error:', err); }
    }

    function subscribeToNewPosts() {
        supabase.channel('public:posts')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'posts' }, payload => {
                const newPost = payload.new;
                if (posts.some(p => p.id === newPost.id)) return;
                posts.unshift(newPost);
                renderPosts(posts);
            })
            .subscribe((status, err) => { if (err) console.error('Realtime error:', err); });
    }

    publishBtn.addEventListener('click', async () => {
        const content = postInput.value.trim();
        if (!content) { postInput.focus(); postInput.style.borderColor = '#f87171'; setTimeout(() => postInput.style.borderColor = '', 1500); return; }
        await createPost(content);
    });

    postInput.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); publishBtn.click(); }
    });

    fetchFeed();
    subscribeToNewPosts();
})();
</script>
</body>
</html>
