<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>World Forum</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ===== RESET & BASE ===== */
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0b0d17;
      color: #e4e6eb;
      padding: 1rem;
      min-height: 100vh;
      overflow: hidden;
    }
    .container { max-width: 720px; margin: 0 auto; }

    /* ===== INTRO OVERLAY ===== */
    .intro-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #0b0d17;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOutContainer 0.6s ease-in-out forwards 2.8s;
    }
    .intro-logo {
      font-size: 4rem;
      font-weight: 900;
      letter-spacing: 4px;
      background: linear-gradient(45deg, #38bdf8, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0;
      transform: scale(0.8);
      animation: zoomIn 1.2s ease-out forwards 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .intro-logo i { -webkit-text-fill-color: #38bdf8; }
    .intro-text {
      font-size: 1.2rem;
      color: #7a82a0;
      margin-top: 16px;
      opacity: 0;
      transform: translateY(20px);
      animation: slideUp 0.8s ease-out forwards 1s;
    }
    .intro-loader {
      margin-top: 2rem;
      width: 48px;
      height: 48px;
      border: 3px solid rgba(255,255,255,0.06);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 1s linear infinite, fadeInLoader 0.6s ease-out forwards 1.6s;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes zoomIn { to { opacity: 1; transform: scale(1); } }
    @keyframes slideUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes fadeInLoader { to { opacity: 1; } }
    @keyframes fadeOutContainer {
      to {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
    }

    /* ===== MAIN CONTENT ===== */
    .main-content {
      opacity: 0;
      animation: fadeInContent 0.6s ease-out forwards 3.2s;
    }
    @keyframes fadeInContent { to { opacity: 1; } }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #13172b;
      border-radius: 16px;
      padding: 0.8rem 1.2rem;
      margin-bottom: 0.8rem;
      border: 1px solid #2a2f4b;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .top-bar .logo {
      font-size: 1.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #2dd4bf);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .top-bar .visitor-badge {
      background: #1e2648;
      padding: 0.3rem 1rem;
      border-radius: 20px;
      color: #88b0f0;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      border: 1px solid #2a2f4b;
    }
    .top-bar .visitor-badge i { color: #38bdf8; }
    .top-bar .auth-badge {
      font-size: 0.8rem;
      background: #1e2648;
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      color: #88b0f0;
    }

    /* ===== STATS ROW ===== */
    .stats-row {
      display: flex;
      justify-content: space-around;
      background: #13172b;
      border-radius: 16px;
      padding: 0.6rem 0.8rem;
      margin-bottom: 1rem;
      border: 1px solid #2a2f4b;
      text-align: center;
    }
    .stats-row .stat-item { display: flex; flex-direction: column; }
    .stats-row .num { font-weight: 700; color: #38bdf8; font-size: 1.2rem; }
    .stats-row .label { color: #7a82a0; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.5px; }

    /* ===== CREATE THREAD ===== */
    .create-thread {
      background: #13172b;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-bottom: 1.2rem;
      border: 1px solid #2a2f4b;
    }
    .create-thread h3 { font-weight: 500; font-size: 0.95rem; color: #a0a8c0; margin-bottom: 0.6rem; }
    .create-thread input, .create-thread textarea {
      width: 100%;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.6rem;
      background: #0f1426;
      border: 1px solid #2a2f4b;
      border-radius: 12px;
      color: #e4e6eb;
      font-size: 0.95rem;
    }
    .create-thread input:focus, .create-thread textarea:focus {
      outline: none;
      border-color: #38bdf8;
    }
    .create-thread textarea { min-height: 70px; resize: vertical; }
    .create-thread .row { display: flex; gap: 0.6rem; flex-wrap: wrap; align-items: center; }
    .create-thread .row input { flex: 2; min-width: 120px; }
    .file-input-wrapper {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.6rem;
    }
    .file-input-wrapper input[type="file"] { display: none; }
    .file-input-wrapper label {
      background: #1e2648;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      color: #88b0f0;
      cursor: pointer;
      font-size: 0.85rem;
    }
    .file-input-wrapper .preview {
      max-width: 60px;
      max-height: 60px;
      border-radius: 8px;
      border: 1px solid #2a2f4b;
      display: none;
    }
    .btn-primary {
      background: linear-gradient(135deg, #0ea5e9, #06b6d4);
      border: none;
      padding: 0.5rem 1.4rem;
      border-radius: 40px;
      color: white;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
      font-size: 0.95rem;
      white-space: nowrap;
    }
    .btn-primary:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(14,165,233,0.3); }
    .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

    .status-msg {
      font-size: 0.85rem;
      padding: 0.3rem 0.8rem;
      border-radius: 30px;
      display: inline-block;
      margin-left: 0.5rem;
    }
    .status-msg.sending { color: #fbbf24; }
    .status-msg.sent { color: #2dd4bf; }
    .status-msg.error { color: #f43f5e; }

    /* ===== ROLE TINTS ===== */
    .admin-post { background: #2a0f1a !important; border: 2px solid #ff0033 !important; box-shadow: 0 0 30px rgba(255,0,51,0.2); }
    .admin-post .author .name { color: #ff0033 !important; font-weight: 800; }
    .admin-badge {
      background: #ff0033; color: #fff; font-size: 0.6rem; padding: 0.15rem 0.6rem;
      border-radius: 20px; margin-left: 0.4rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .mod-post { background: #1f2a0f !important; border: 2px solid #ff8800 !important; box-shadow: 0 0 30px rgba(255,136,0,0.2); }
    .mod-post .author .name { color: #ff8800 !important; font-weight: 800; }
    .mod-badge {
      background: #ff8800; color: #fff; font-size: 0.6rem; padding: 0.15rem 0.6rem;
      border-radius: 20px; margin-left: 0.4rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .unverified-post { background: #1a1a2a !important; border: 2px solid rgba(255,255,255,0.2) !important; box-shadow: 0 0 30px rgba(255,255,255,0.05); }
    .unverified-post .author .name { color: #aaa !important; font-weight: 400; }
    .unverified-badge {
      background: rgba(255,255,255,0.1); color: #aaa; font-size: 0.6rem;
      padding: 0.15rem 0.6rem; border-radius: 20px; margin-left: 0.4rem;
      font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* ===== DELETE BUTTON ===== */
    .delete-btn {
      background: rgba(255,0,0,0.15) !important;
      border: 1px solid rgba(255,0,0,0.3) !important;
      color: #ff6b6b !important;
      padding: 0.15rem 0.8rem !important;
      border-radius: 30px !important;
      font-size: 0.7rem !important;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .delete-btn:hover {
      background: rgba(255,0,0,0.25) !important;
      border-color: #ff0033 !important;
      color: #fff !important;
      transform: scale(1.05);
    }

    .my-post { border-left-color: #38bdf8 !important; border-left-width: 5px; }

    /* ===== THREAD CARD ===== */
    .thread-card {
      background: #13172b;
      border-radius: 16px;
      padding: 1rem 1.2rem;
      margin-bottom: 1rem;
      border: 1px solid #2a2f4b;
      transition: all 0.2s ease;
    }
    .thread-card .author { display: flex; align-items: center; gap: 0.6rem; margin-bottom: 0.4rem; flex-wrap: wrap; }
    .thread-card .author img { width: 32px; height: 32px; border-radius: 50%; background: #1e2648; border: 2px solid #2a2f4b; }
    .thread-card .author .name { font-weight: 600; font-size: 0.9rem; }
    .thread-card .author .time { font-size: 0.7rem; color: #7a82a0; margin-left: auto; }
    .thread-card .author .lock-icon { color: #fbbf24; margin-left: 0.3rem; }
    .thread-card .author .age-icon { color: #fbbf24; margin-left: 0.3rem; }
    .thread-card .author .delete-wrap { margin-left: auto; display: flex; align-items: center; gap: 0.3rem; }
    .thread-card h2 { font-size: 1.1rem; font-weight: 600; margin: 0.2rem 0 0.3rem; }
    .thread-card .content { color: #c8cee0; line-height: 1.4; margin-bottom: 0.5rem; font-size: 0.95rem; word-wrap: break-word; }
    .thread-card .thread-image { max-width: 100%; border-radius: 12px; margin: 0.5rem 0; max-height: 300px; object-fit: cover; cursor: pointer; }
    .image-blur { filter: blur(20px); transition: filter 0.3s ease; }
    .image-blur.unblurred { filter: none; }
    .thread-card .actions {
      display: flex;
      gap: 1.2rem;
      font-size: 0.8rem;
      color: #7a82a0;
      border-top: 1px solid #1e2648;
      padding-top: 0.5rem;
      margin-top: 0.3rem;
      flex-wrap: wrap;
    }
    .thread-card .actions span { display: flex; align-items: center; gap: 0.3rem; cursor: pointer; }
    .thread-card .actions span i { font-size: 0.9rem; }
    .thread-card .actions .liked { color: #f43f5e; }
    .show-replies-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      font-size: 0.8rem;
      cursor: pointer;
      padding: 0.2rem 0;
      margin-top: 0.3rem;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }
    .show-replies-btn:hover { text-decoration: underline; }

    /* ===== REPLIES ===== */
    .replies-container { margin-top: 0.8rem; padding-left: 1rem; border-left: 2px solid #2a2f4b; }
    .reply-item {
      background: #0f1426;
      border-radius: 12px;
      padding: 0.6rem 0.9rem;
      margin-bottom: 0.5rem;
      border: 1px solid #1e2648;
      transition: all 0.2s ease;
    }
    .reply-item .author { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.1rem; flex-wrap: wrap; }
    .reply-item .author img { width: 24px; height: 24px; border-radius: 50%; background: #1e2648; }
    .reply-item .author .name { font-weight: 500; font-size: 0.8rem; }
    .reply-item .author .time { font-size: 0.65rem; color: #7a82a0; margin-left: auto; }
    .reply-item .author .delete-wrap { margin-left: auto; display: flex; align-items: center; gap: 0.3rem; }
    .reply-item .content { font-size: 0.9rem; color: #c8cee0; margin-top: 0.1rem; word-wrap: break-word; }
    .reply-item .reply-image { max-width: 100%; border-radius: 8px; margin-top: 0.3rem; max-height: 200px; object-fit: cover; cursor: pointer; }
    .reply-item .admin-post { background: #2a0f1a !important; border: 1px solid #ff0033 !important; }
    .reply-item .mod-post { background: #1f2a0f !important; border: 1px solid #ff8800 !important; }
    .reply-item .unverified-post { background: #1a1a2a !important; border: 1px solid rgba(255,255,255,0.2) !important; }
    .reply-item.my-post { border-left: 3px solid #38bdf8 !important; border-left-width: 4px; }

    .reply-form { margin-top: 0.6rem; display: flex; flex-wrap: wrap; gap: 0.4rem; }
    .reply-form input, .reply-form textarea {
      flex: 1;
      min-width: 80px;
      padding: 0.4rem 0.7rem;
      background: #0f1426;
      border: 1px solid #2a2f4b;
      border-radius: 20px;
      color: #e4e6eb;
      font-size: 0.85rem;
    }
    .reply-form textarea { flex-basis: 100%; min-height: 40px; border-radius: 12px; }
    .reply-form button { background: #1e2648; border: none; padding: 0.4rem 1rem; border-radius: 30px; color: #88b0f0; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    .reply-form button:hover { background: #2a3360; color: white; }
    .reply-form button:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ===== LOCK / AGE OVERLAYS ===== */
    .lock-overlay, .age-overlay {
      background: rgba(0,0,0,0.85);
      padding: 1rem;
      border-radius: 12px;
      text-align: center;
      margin: 0.5rem 0;
    }
    .lock-overlay input, .age-overlay input {
      background: #0f1426;
      border: 1px solid #2a2f4b;
      color: #e4e6eb;
      padding: 0.5rem;
      border-radius: 8px;
      margin: 0.3rem;
    }
    .lock-overlay button, .age-overlay button {
      background: #0ea5e9;
      border: none;
      padding: 0.3rem 1rem;
      border-radius: 30px;
      color: white;
      cursor: pointer;
    }
    .lock-overlay button:hover, .age-overlay button:hover { background: #0284c7; }

    /* ===== LOADING ===== */
    .threads-loading {
      text-align: center;
      padding: 2rem;
      color: #7a82a0;
    }
    .threads-loading i { font-size: 2rem; display: block; margin-bottom: 0.5rem; color: #38bdf8; }

    .hidden { display: none !important; }
    .text-muted { color: #7a82a0; font-size: 0.85rem; }

    @media (max-width: 480px) {
      .top-bar { flex-wrap: wrap; gap: 0.5rem; justify-content: center; }
      .stats-row .stat-item .num { font-size: 1rem; }
      .create-thread .row { flex-direction: column; align-items: stretch; }
      .create-thread .row input { flex: auto; }
      .btn-primary { width: 100%; justify-content: center; }
    }
  </style>
</head>
<body>

  <!-- ===== INTRO OVERLAY ===== -->
  <div class="intro-overlay">
    <div class="intro-logo"><i class="fas fa-globe-americas"></i> World</div>
    <div class="intro-text">Your universe awaits</div>
    <div class="intro-loader"></div>
  </div>

  <!-- ===== MAIN CONTENT ===== -->
  <div class="main-content">
    <div class="container">

      <!-- Top Bar -->
      <div class="top-bar">
        <div class="logo"><i class="fas fa-globe-americas"></i> World</div>
        <div class="visitor-badge" id="visitorBadge">
          <i class="fas fa-user"></i>
          <span id="visitorCount">0</span>
        </div>
        <div class="auth-badge" id="auth-status"><i class="fas fa-user-secret"></i> Anonymous</div>
      </div>

      <!-- Stats -->
      <div class="stats-row">
        <div class="stat-item"><span class="num" id="stat-threads">0</span><span class="label">Threads</span></div>
        <div class="stat-item"><span class="num" id="stat-replies">0</span><span class="label">Replies</span></div>
        <div class="stat-item"><span class="num" id="stat-online">0</span><span class="label">Online</span></div>
        <div class="stat-item"><span class="num" id="stat-total">0</span><span class="label">Total Visits</span></div>
      </div>

      <!-- Create Thread -->
      <div class="create-thread">
        <h3><i class="fas fa-pen-fancy" style="color:#2dd4bf;"></i> New thread</h3>
        <input type="text" id="thread-title" placeholder="Title..." />
        <textarea id="thread-content" placeholder="Write your first post..."></textarea>
        <div class="file-input-wrapper">
          <input type="file" id="thread-image-input" accept="image/*" />
          <label for="thread-image-input"><i class="fas fa-image"></i> Add image</label>
          <img id="thread-image-preview" class="preview" alt="preview" />
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 0.5rem; margin: 0.5rem 0;">
          <label style="display: flex; align-items: center; gap: 0.3rem; color: #aaa;">
            <input type="checkbox" id="thread-blur" /> Blur image
          </label>
          <input type="text" id="thread-password" placeholder="Password lock (optional)" style="flex:1; min-width:120px; background:#0f1426; border:1px solid #2a2f4b; border-radius:12px; color:#e4e6eb; padding:0.6rem 0.9rem;" />
          <input type="number" id="thread-age" placeholder="Min age (0=none)" style="width:100px; background:#0f1426; border:1px solid #2a2f4b; border-radius:12px; color:#e4e6eb; padding:0.6rem 0.9rem;" />
        </div>
        <div class="row" style="display:flex; flex-wrap:wrap; gap:0.6rem; align-items:center;">
          <input type="text" id="author-name" placeholder="Your name (optional)" style="flex:2; min-width:120px;" />
          <button class="btn-primary" id="create-thread-btn"><i class="fas fa-paper-plane"></i> Post</button>
          <span id="thread-status" class="status-msg" style="display:none;"></span>
        </div>
      </div>

      <!-- Threads Feed -->
      <div id="threads-container"></div>
    </div>
  </div>

  <script>
    // ============================================================
    // RESTORE SCROLL AFTER INTRO
    // ============================================================
    setTimeout(() => { document.body.style.overflow = "auto"; }, 3300);

    // ============================================================
    // SUPABASE SETUP
    // ============================================================
    const SUPABASE_URL = 'https://divcsisxjrbruduyophx.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_PSpZ4GImD-mCAau3F2U6LA_W757gdMM';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // ============================================================
    // SESSION ID
    // ============================================================
    function getSessionId() {
      let id = localStorage.getItem('forum_session_id');
      if (!id) {
        id = crypto.randomUUID ? crypto.randomUUID() : 'sess_' + Date.now() + '_' + Math.random().toString(36).slice(2);
        localStorage.setItem('forum_session_id', id);
      }
      return id;
    }

    // ============================================================
    // VISITOR TRACKING
    // ============================================================
    async function updateActiveSession() {
      const sessionId = getSessionId();
      const { error } = await supabaseClient
        .from('active_sessions')
        .upsert({ session_id: sessionId, last_active: new Date().toISOString() }, { onConflict: 'session_id' });
      if (error) console.error('Active session error:', error);
    }

    async function updateStats() {
      if (!sessionStorage.getItem('visit_counted')) {
        const { data, error } = await supabaseClient.rpc('increment_total_visits');
        if (!error && data) {
          document.getElementById('stat-total').textContent = data;
          document.getElementById('visitorCount').textContent = data;
        }
        sessionStorage.setItem('visit_counted', 'true');
      } else {
        const { data, error } = await supabaseClient.from('site_stats').select('total_visits').eq('id', 1).single();
        if (!error && data) {
          document.getElementById('stat-total').textContent = data.total_visits;
          document.getElementById('visitorCount').textContent = data.total_visits;
        }
      }

      const thirtySecondsAgo = new Date(Date.now() - 30000).toISOString();
      const { count, error: countError } = await supabaseClient
        .from('active_sessions')
        .select('*', { count: 'exact', head: true })
        .gt('last_active', thirtySecondsAgo);

      if (!countError) {
        document.getElementById('stat-online').textContent = count || 0;
      }
    }

    let heartbeatInterval = null;
    function startHeartbeat() {
      updateActiveSession();
      heartbeatInterval = setInterval(() => {
        updateActiveSession();
        updateStats();
      }, 15000);
    }

    // ============================================================
    // HELPERS
    // ============================================================
    function sanitizeInput(text) {
      if (!text) return '';
      const temp = document.createElement('div');
      temp.textContent = text;
      return temp.innerHTML;
    }

    async function sha256(message) {
      const msgBuffer = new TextEncoder().encode(message);
      const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    function saveName(name) {
      if (name && name.trim()) localStorage.setItem('forum_username', name.trim());
    }
    function loadName() { return localStorage.getItem('forum_username') || ''; }
    function getUserName() { const stored = loadName(); return stored || 'Anonymous'; }
    document.getElementById('author-name').addEventListener('input', function() { saveName(this.value); });
    document.getElementById('author-name').addEventListener('blur', function() { saveName(this.value); });
    document.getElementById('author-name').value = loadName();
    function ensureNameSaved() { saveName(document.getElementById('author-name').value); }

    function getAvatar(name) {
      const initial = name && name.trim() ? name.charAt(0).toUpperCase() : '?';
      return `https://ui-avatars.com/api/?name=${encodeURIComponent(initial)}&background=1e2648&color=38bdf8&size=64&bold=true`;
    }

    function playPopSound() {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const oscillator = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        oscillator.frequency.value = 800;
        gainNode.gain.value = 0.08;
        oscillator.start();
        oscillator.stop(audioCtx.currentTime + 0.05);
      } catch(e) { /* ignore */ }
    }

    function triggerHaptics() { if (navigator.vibrate) navigator.vibrate(10); }

    async function uploadImage(file, folder = 'threads') {
      const fileName = `${Date.now()}_${file.name}`;
      const filePath = `${folder}/${fileName}`;
      const { data, error } = await supabaseClient.storage.from('images').upload(filePath, file);
      if (error) { console.error('Upload error:', error); return null; }
      const { data: publicUrlData } = supabaseClient.storage.from('images').getPublicUrl(filePath);
      return publicUrlData.publicUrl;
    }

    function setStatus(element, message, type = 'sending') {
      if (!element) return;
      element.textContent = message;
      element.className = `status-msg ${type}`;
      element.style.display = 'inline-block';
      if (type === 'sent' || type === 'error') {
        setTimeout(() => { element.style.display = 'none'; }, 3000);
      }
    }

    function getUserDisplay(name) {
      const trimmed = name ? name.trim() : '';
      if (!trimmed) {
        return { displayName: 'Unverified', role: 'unverified', badge: '<span class="unverified-badge">Unverified</span>' };
      }
      const lower = trimmed.toLowerCase();
      if (lower === 'admin') {
        return { displayName: trimmed, role: 'admin', badge: '<span class="admin-badge">Admin</span>' };
      }
      if (lower === 'mod') {
        return { displayName: trimmed, role: 'mod', badge: '<span class="mod-badge">Mod</span>' };
      }
      return { displayName: trimmed, role: 'user', badge: '' };
    }

    // ============================================================
    // DELETE FUNCTIONS
    // ============================================================
    window.deleteThread = async function(threadId) {
      if (!confirm('Delete this thread and all replies? This cannot be undone.')) return;
      try {
        const { error } = await supabaseClient.from('threads').delete().eq('id', threadId);
        if (error) { alert('❌ Error: ' + error.message); return; }
        alert('✅ Thread deleted.');
        loadThreads();
      } catch (e) { alert('❌ Error: ' + e.message); }
    };

    window.deleteReply = async function(threadId, postId) {
      if (!confirm('Delete this reply? This cannot be undone.')) return;
      try {
        const { error } = await supabaseClient.from('posts').delete().eq('id', postId);
        if (error) { alert('❌ Error: ' + error.message); return; }
        alert('✅ Reply deleted.');
        await viewThread(threadId);
        loadThreads();
      } catch (e) { alert('❌ Error: ' + e.message); }
    };

    // ============================================================
    // LOAD THREADS
    // ============================================================
    async function loadThreads() {
      const container = document.getElementById('threads-container');
      container.innerHTML = `<div class="threads-loading"><i class="fas fa-spinner fa-pulse"></i><span>Loading threads...</span></div>`;

      const { data: threads, error } = await supabaseClient.from('threads').select('*').order('created_at', { ascending: false });
      if (error) {
        container.innerHTML = `<div class="thread-card" style="border-color:#f43f5e;"><p>❌ Error: ${error.message}</p></div>`;
        return;
      }

      document.getElementById('stat-threads').textContent = threads ? threads.length : 0;
      let totalReplies = 0;
      if (threads && threads.length > 0) {
        const threadIds = threads.map(t => t.id);
        const { count } = await supabaseClient.from('posts').select('*', { count: 'exact', head: true }).in('thread_id', threadIds);
        if (count !== null) totalReplies = count;
      }
      document.getElementById('stat-replies').textContent = totalReplies;

      if (!threads || threads.length === 0) {
        container.innerHTML = `<div class="thread-card"><p class="text-muted">No threads yet. Start one above!</p></div>`;
        return;
      }

      const userName = getUserName();
      const sessionId = getSessionId();

      let html = '';
      for (const t of threads) {
        const { count: likeCount } = await supabaseClient.from('likes').select('*', { count: 'exact', head: true }).eq('thread_id', t.id);
        const { count: userLikeCount } = await supabaseClient.from('likes').select('*', { count: 'exact', head: true }).eq('thread_id', t.id).eq('user_name', userName);
        const userLike = userLikeCount > 0;
        const { count: replyCount } = await supabaseClient.from('posts').select('*', { count: 'exact', head: true }).eq('thread_id', t.id);

        const safeTitle = sanitizeInput(t.title);
        const safeContent = sanitizeInput(t.content || '');
        const rawAuthor = t.author_name || '';
        const userInfo = getUserDisplay(rawAuthor);
        const displayName = userInfo.displayName;
        const roleClass = userInfo.role === 'admin' ? 'admin-post' : userInfo.role === 'mod' ? 'mod-post' : userInfo.role === 'unverified' ? 'unverified-post' : '';
        const badgeHtml = userInfo.badge;

        const isMyPost = t.session_id === sessionId;
        const myPostClass = isMyPost ? 'my-post' : '';

        let imageHtml = '';
        if (t.image_url) {
          const blurredClass = t.blurred ? 'image-blur' : '';
          const unblurred = localStorage.getItem(`unblurred_${t.id}`) === 'true' ? 'unblurred' : '';
          const imgClass = `thread-image ${blurredClass} ${unblurred}`.trim();
          imageHtml = `<img src="${t.image_url}" class="${imgClass}" alt="thread image" onclick="toggleBlur('${t.id}', this)" />`;
        }

        let lockHtml = '';
        let passwordVerified = false;
        if (t.password_hash) {
          const unlocked = localStorage.getItem(`unlocked_${t.id}`) === 'true';
          if (!unlocked) {
            lockHtml = `
              <div class="lock-overlay">
                <p><i class="fas fa-lock"></i> This post is password protected.</p>
                <input type="password" id="pwd-input-${t.id}" placeholder="Enter password" />
                <button onclick="unlockThread('${t.id}')">Unlock</button>
                <span id="pwd-error-${t.id}" style="color:#f43f5e; display:block;"></span>
              </div>
            `;
          } else { passwordVerified = true; }
        }

        let ageHtml = '';
        let ageVerified = false;
        if (t.age_required && t.age_required > 0) {
          const ageOk = localStorage.getItem(`age_verified_${t.id}`) === 'true';
          if (!ageOk) {
            ageHtml = `
              <div class="age-overlay">
                <p><i class="fas fa-shield-alt"></i> This post requires age ${t.age_required}+.</p>
                <input type="number" id="age-input-${t.id}" placeholder="Enter your age" />
                <button onclick="verifyAge('${t.id}', ${t.age_required})">Verify</button>
                <span id="age-error-${t.id}" style="color:#f43f5e; display:block;"></span>
              </div>
            `;
          } else { ageVerified = true; }
        }

        const showContent = (!t.password_hash || passwordVerified) && (!t.age_required || t.age_required === 0 || ageVerified);

        const lockIcon = t.password_hash ? `<i class="fas fa-lock lock-icon" title="Password protected"></i>` : '';
        const ageIcon = t.age_required && t.age_required > 0 ? `<i class="fas fa-shield-alt age-icon" title="Age ${t.age_required}+"></i>` : '';

        // Admin actions – Follow button removed
        let adminActions = '';
        if (userInfo.role === 'admin') {
          adminActions = `
            <div class="admin-actions">
              <!-- Follow button removed -->
            </div>
          `;
        }

        // Delete button (only for own posts)
        const deleteBtn = isMyPost ? `
          <div class="delete-wrap">
            <button class="delete-btn" onclick="deleteThread('${t.id}')"><i class="fas fa-trash"></i> Delete</button>
          </div>
        ` : '';

        html += `
          <div class="thread-card ${roleClass} ${myPostClass}" data-thread-id="${t.id}">
            <div class="author">
              <img src="${getAvatar(displayName === 'Unverified' ? '' : displayName)}" alt="" />
              <span class="name">${sanitizeInput(displayName)} ${badgeHtml}</span>
              ${isMyPost ? `<span style="font-size:0.6rem; color:#38bdf8; background:#1e2648; padding:0.1rem 0.5rem; border-radius:10px;">You</span>` : ''}
              <span class="time">${new Date(t.created_at).toLocaleString()}</span>
              ${lockIcon} ${ageIcon}
              ${deleteBtn}
            </div>
            <h2>${safeTitle}</h2>
            ${showContent ? `<div class="content">${safeContent}</div>${imageHtml}` : `
              <div class="content" style="opacity:0.3; filter: blur(4px); pointer-events:none;">${safeContent.substring(0, 100)}...</div>
              ${t.image_url ? `<div style="filter: blur(20px);">${imageHtml}</div>` : ''}
            `}
            ${!showContent ? lockHtml + ageHtml : ''}
            ${adminActions}
            <div class="actions">
              <span class="like-toggle ${userLike ? 'liked' : ''}" data-thread="${t.id}" onclick="toggleLike('${t.id}')">
                <i class="fas fa-heart"></i> <span class="like-count">${likeCount || 0}</span>
              </span>
              <span><i class="fas fa-comment"></i> ${replyCount || 0}</span>
              <span><i class="fas fa-share"></i> Share</span>
            </div>
            <div id="replies-${t.id}" class="replies-container hidden"></div>
            <button class="show-replies-btn" onclick="viewThread('${t.id}')">
              <i class="fas fa-chevron-down"></i> Show replies
            </button>
          </div>
        `;
      }
      container.innerHTML = html;
    }

    // ============================================================
    // BLUR, UNLOCK, AGE
    // ============================================================
    window.toggleBlur = function(threadId, imgElement) {
      const current = imgElement.classList.contains('unblurred');
      if (current) {
        imgElement.classList.remove('unblurred');
        localStorage.setItem(`unblurred_${threadId}`, 'false');
      } else {
        imgElement.classList.add('unblurred');
        localStorage.setItem(`unblurred_${threadId}`, 'true');
      }
    };

    window.unlockThread = async function(threadId) {
      const input = document.getElementById(`pwd-input-${threadId}`);
      const errorSpan = document.getElementById(`pwd-error-${threadId}`);
      const entered = input.value;
      if (!entered) { errorSpan.textContent = 'Enter a password.'; return; }
      const { data, error } = await supabaseClient.from('threads').select('password_hash').eq('id', threadId).single();
      if (error) { errorSpan.textContent = 'Error fetching password.'; return; }
      const enteredHash = await sha256(entered);
      if (enteredHash === data.password_hash) {
        localStorage.setItem(`unlocked_${threadId}`, 'true');
        loadThreads();
      } else {
        errorSpan.textContent = 'Incorrect password.';
      }
    };

    window.verifyAge = function(threadId, requiredAge) {
      const input = document.getElementById(`age-input-${threadId}`);
      const errorSpan = document.getElementById(`age-error-${threadId}`);
      const age = parseInt(input.value);
      if (isNaN(age) || age < requiredAge) {
        errorSpan.textContent = `You must be at least ${requiredAge} years old.`;
        return;
      }
      localStorage.setItem(`age_verified_${threadId}`, 'true');
      loadThreads();
    };

    // ============================================================
    // LIKE
    // ============================================================
    window.toggleLike = async function(threadId) {
      const userName = getUserName();
      const likeToggle = document.querySelector(`.like-toggle[data-thread="${threadId}"]`);
      if (!likeToggle) return;
      const { data: existing } = await supabaseClient.from('likes').select('*').eq('thread_id', parseInt(threadId)).eq('user_name', userName);
      if (existing && existing.length > 0) {
        const { error } = await supabaseClient.from('likes').delete().eq('thread_id', parseInt(threadId)).eq('user_name', userName);
        if (error) { alert('Error: ' + error.message); return; }
      } else {
        const { error } = await supabaseClient.from('likes').insert([{ thread_id: parseInt(threadId), user_name: userName }]);
        if (error) { alert('Error: ' + error.message); return; }
        triggerHaptics();
        playPopSound();
      }
      loadThreads();
    };

    // ============================================================
    // VIEW REPLIES
    // ============================================================
    window.viewThread = async function(threadId) {
      const container = document.getElementById(`replies-${threadId}`);
      if (!container) return;
      if (container.classList.contains('hidden')) {
        container.classList.remove('hidden');
        const { data: posts, error } = await supabaseClient.from('posts').select('*').eq('thread_id', threadId).order('created_at', { ascending: true });
        if (error) {
          container.innerHTML = `<p style="color:#f43f5e;">❌ Error: ${error.message}</p>`;
          return;
        }

        const sessionId = getSessionId();
        let html = '';
        if (!posts || posts.length === 0) {
          html = '<p class="text-muted">No replies yet. Be the first!</p>';
        } else {
          html = posts.map(p => {
            const rawAuthor = p.author_name || '';
            const userInfo = getUserDisplay(rawAuthor);
            const displayName = userInfo.displayName;
            const roleClass = userInfo.role === 'admin' ? 'admin-post' : userInfo.role === 'mod' ? 'mod-post' : userInfo.role === 'unverified' ? 'unverified-post' : '';
            const badgeHtml = userInfo.badge;
            const safeContent = sanitizeInput(p.content);
            const isMyPost = p.session_id === sessionId;
            const myPostClass = isMyPost ? 'my-post' : '';
            const deleteBtn = isMyPost ? `
              <div class="delete-wrap">
                <button class="delete-btn" onclick="deleteReply('${threadId}', '${p.id}')"><i class="fas fa-trash"></i></button>
              </div>
            ` : '';
            return `
              <div class="reply-item ${roleClass} ${myPostClass}">
                <div class="author">
                  <img src="${getAvatar(displayName === 'Unverified' ? '' : displayName)}" alt="" />
                  <span class="name">${sanitizeInput(displayName)} ${badgeHtml}</span>
                  ${isMyPost ? `<span style="font-size:0.55rem; color:#38bdf8; background:#1e2648; padding:0.05rem 0.4rem; border-radius:8px;">You</span>` : ''}
                  <span class="time">${new Date(p.created_at).toLocaleString()}</span>
                  ${deleteBtn}
                </div>
                <div class="content">${safeContent}</div>
                ${p.image_url ? `<img src="${p.image_url}" class="reply-image" />` : ''}
              </div>
            `;
          }).join('');
        }

        html += `
          <div class="reply-form">
            <input type="text" id="reply-author-${threadId}" placeholder="Your name" />
            <textarea id="reply-content-${threadId}" placeholder="Write a reply..." rows="2"></textarea>
            <div class="file-input-wrapper" style="flex-basis:100%;">
              <input type="file" id="reply-image-${threadId}" accept="image/*" />
              <label for="reply-image-${threadId}" style="font-size:0.75rem;"><i class="fas fa-image"></i> Add image</label>
              <img id="reply-image-preview-${threadId}" class="preview" />
            </div>
            <button onclick="addReply('${threadId}')"><i class="fas fa-reply"></i> Reply</button>
            <span id="reply-status-${threadId}" class="status-msg" style="display:none;"></span>
          </div>
        `;
        container.innerHTML = html;
        setTimeout(() => container.scrollTop = container.scrollHeight, 100);
      } else {
        container.classList.add('hidden');
      }
    };

    // ============================================================
    // ADD REPLY
    // ============================================================
    window.addReply = async function(threadId) {
      const authorInput = document.getElementById(`reply-author-${threadId}`);
      const contentInput = document.getElementById(`reply-content-${threadId}`);
      const imageInput = document.getElementById(`reply-image-${threadId}`);
      const statusEl = document.getElementById(`reply-status-${threadId}`);
      const btn = document.querySelector(`#replies-${threadId} .reply-form button`);

      const rawAuthor = authorInput.value.trim();
      const rawContent = contentInput.value.trim();
      if (!rawContent) { alert('Write something.'); return; }

      const author = rawAuthor;
      const content = sanitizeInput(rawContent);
      const sessionId = getSessionId();

      btn.disabled = true;
      setStatus(statusEl, 'Sending...', 'sending');

      let imageUrl = null;
      if (imageInput && imageInput.files && imageInput.files[0]) {
        const file = imageInput.files[0];
        imageUrl = await uploadImage(file, 'replies');
        if (!imageUrl) {
          setStatus(statusEl, 'Image upload failed', 'error');
          btn.disabled = false;
          return;
        }
      }

      const { error } = await supabaseClient.from('posts').insert([{
        thread_id: parseInt(threadId),
        author_name: author,
        content: content,
        image_url: imageUrl,
        session_id: sessionId
      }]);

      if (error) {
        setStatus(statusEl, 'Failed: ' + error.message, 'error');
        btn.disabled = false;
        return;
      }

      setStatus(statusEl, 'Sent! ✅', 'sent');
      authorInput.value = '';
      contentInput.value = '';
      if (imageInput) imageInput.value = '';
      const preview = document.getElementById(`reply-image-preview-${threadId}`);
      if (preview) { preview.style.display = 'none'; preview.src = ''; }

      playPopSound();
      triggerHaptics();

      await viewThread(threadId);
      loadThreads();
      btn.disabled = false;
    };

    // ============================================================
    // CREATE THREAD
    // ============================================================
    document.getElementById('create-thread-btn').addEventListener('click', async function() {
      ensureNameSaved();
      const titleInput = document.getElementById('thread-title');
      const contentInput = document.getElementById('thread-content');
      const authorInput = document.getElementById('author-name');
      const imageInput = document.getElementById('thread-image-input');
      const blurCheck = document.getElementById('thread-blur');
      const passwordInput = document.getElementById('thread-password');
      const ageInput = document.getElementById('thread-age');
      const statusEl = document.getElementById('thread-status');

      const rawTitle = titleInput.value.trim();
      const rawContent = contentInput.value.trim();
      const rawAuthor = authorInput.value.trim();
      if (!rawTitle) { alert('Enter a title.'); return; }

      const title = sanitizeInput(rawTitle);
      const content = sanitizeInput(rawContent);
      const author = rawAuthor;
      const blurred = blurCheck.checked;
      let password_hash = null;
      const password = passwordInput.value.trim();
      if (password) { password_hash = await sha256(password); }
      const age_required = parseInt(ageInput.value) || 0;
      const sessionId = getSessionId();

      this.disabled = true;
      setStatus(statusEl, 'Sending...', 'sending');

      let imageUrl = null;
      if (imageInput && imageInput.files && imageInput.files[0]) {
        const file = imageInput.files[0];
        imageUrl = await uploadImage(file, 'threads');
        if (!imageUrl) {
          setStatus(statusEl, 'Image upload failed', 'error');
          this.disabled = false;
          return;
        }
      }

      const { error } = await supabaseClient.from('threads').insert([{
        title: title,
        content: content,
        author_name: author,
        image_url: imageUrl,
        blurred: blurred,
        password_hash: password_hash,
        age_required: age_required,
        session_id: sessionId
      }]);

      if (error) {
        setStatus(statusEl, 'Failed: ' + error.message, 'error');
        this.disabled = false;
        return;
      }

      setStatus(statusEl, 'Sent! ✅', 'sent');
      titleInput.value = '';
      contentInput.value = '';
      authorInput.value = '';
      imageInput.value = '';
      document.getElementById('thread-image-preview').style.display = 'none';
      blurCheck.checked = false;
      passwordInput.value = '';
      ageInput.value = '';
      loadThreads();
      this.disabled = false;
    });

    // ============================================================
    // IMAGE PREVIEW
    // ============================================================
    document.getElementById('thread-image-input').addEventListener('change', function(e) {
      const preview = document.getElementById('thread-image-preview');
      if (this.files && this.files[0]) {
        const reader = new FileReader();
        reader.onload = function(ev) { preview.src = ev.target.result; preview.style.display = 'block'; };
        reader.readAsDataURL(this.files[0]);
      } else { preview.style.display = 'none'; }
    });

    document.addEventListener('change', function(e) {
      const target = e.target;
      if (target && target.id && target.id.startsWith('reply-image-')) {
        const threadId = target.id.split('-')[2];
        const preview = document.getElementById(`reply-image-preview-${threadId}`);
        if (preview && target.files && target.files[0]) {
          const reader = new FileReader();
          reader.onload = function(ev) { preview.src = ev.target.result; preview.style.display = 'block'; };
          reader.readAsDataURL(target.files[0]);
        } else if (preview) { preview.style.display = 'none'; }
      }
    });

    // ============================================================
    // AUTH
    // ============================================================
    async function checkAuth() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      const status = document.getElementById('auth-status');
      if (session) status.innerHTML = `<i class="fas fa-check-circle" style="color:#2dd4bf;"></i> ${session.user.email}`;
      else status.innerHTML = `<i class="fas fa-user-secret"></i> Anonymous`;
    }

    // ============================================================
    // INIT
    // ============================================================
    async function init() {
      try {
        await loadThreads();
        await checkAuth();
        await updateStats();
        startHeartbeat();
      } catch (e) {
        console.error('Init error:', e);
      }
    }

    setTimeout(init, 100);
  </script>
</body>
</html>
